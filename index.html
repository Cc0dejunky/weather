<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAISY: Emergency Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --danger-red: #cc0000;
            --caution-yellow: #facc15;
            --safe-green: #15803d;
        }

        body {
            background-color: #ffffff !important;
            color: #000000 !important;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
        }

        h1 {
            font-weight: 900;
            font-size: 3.5rem;
            text-transform: uppercase;
            border-bottom: 8px solid #000;
            line-height: 1;
            margin-bottom: 15px;
        }

        .brand-border {
            border: 6px solid #000000;
            background: #ffffff;
            padding: 20px;
            margin-bottom: 20px;
        }

        .radar-container {
            border: 6px solid #000;
            height: 550px;
        }

        input {
            font-size: 2rem !important;
            font-weight: 900 !important;
            border: 5px solid #000 !important;
            padding: 20px !important;
            width: 100%;
            background: #fff !important;
        }

        .btn-pin {
            background-color: #00008b;
            color: #fff;
            font-size: 2rem;
            font-weight: 900;
            padding: 20px;
            width: 100%;
            margin-top: 15px;
        }

        .alert-card {
            border: 6px solid #000;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .urgent-red { background-color: #fee2e2; border-color: var(--danger-red); }
        .urgent-yellow { background-color: #fefce8; border-color: var(--caution-yellow); }
        
        .distance-tag {
            background: #000;
            color: #fff;
            padding: 5px 15px;
            font-weight: 900;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="max-w-7xl mx-auto">
        <header class="mb-6">
            <h1>D.A.I.S.Y. INTELLIGENT</h1>
            <div class="flex justify-between items-center bg-black text-white p-5">
                <span class="font-black text-2xl uppercase">SMART SECTOR SCANNING ACTIVE</span>
                <span id="lastSync" class="font-black text-3xl">SYNCING...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-10">
            <div class="lg:col-span-3">
                <div class="radar-container mb-10">
                    <iframe width="100%" height="100%" 
                        src="https://embed.windy.com/embed2.html?lat=35.385&lon=-94.398&zoom=8&level=surface&overlay=radar&product=radar&message=true" 
                        frameborder="0">
                    </iframe>
                </div>

                <div class="brand-border">
                    <h2 class="text-5xl font-black mb-6 underline">SORTED BY PROXIMITY</h2>
                    <div id="alertsContainer" class="space-y-6">
                        <p class="text-2xl font-bold italic">Calculating distances to pinned locations...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="brand-border">
                    <h3 class="text-3xl font-black mb-6 underline">MY ASSETS</h3>
                    <div class="mb-10">
                        <label class="block font-black text-xl mb-2 uppercase">PIN NEW LOCATION:</label>
                        <input id="addrIn" type="text" placeholder="ZIP OR CITY">
                        <button onclick="addAsset()" class="btn-pin">PIN & SCAN</button>
                    </div>
                    <div id="assetList" class="space-y-6"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let assets = [];
        const NWS_URL = "https://api.weather.gov/alerts/active?event=Tornado%20Warning,Tornado%20Watch,Severe%20Thunderstorm%20Warning";

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8; // Miles
            const dLat = (lat2-lat1) * Math.PI / 180;
            const dLon = (lon2-lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function fetchAlerts() {
            try {
                const response = await fetch(NWS_URL, { headers: { 'User-Agent': 'DAISY_Smart_v1' } });
                const data = await response.json();
                processAlerts(data.features);
                document.getElementById('lastSync').textContent = new Date().toLocaleTimeString();
            } catch (err) { document.getElementById('lastSync').textContent = "OFFLINE"; }
        }

        function processAlerts(features) {
            const container = document.getElementById('alertsContainer');
            container.innerHTML = '';

            if (!features || features.length === 0) {
                container.innerHTML = '<div class="text-4xl font-black text-green-700 uppercase">All Sectors Clear</div>';
                return;
            }

            // Calculate distance to first pinned asset for sorting
            if (assets.length > 0) {
                features.forEach(f => {
                    // Estimate center from polygons or geocodes
                    const coords = f.geometry ? f.geometry.coordinates[0][0] : [-94.39, 35.38];
                    f.distance = getDistance(assets[0].lat, assets[0].lon, coords[1], coords[0]);
                });
                features.sort((a, b) => a.distance - b.distance);
            }

            features.forEach(f => {
                const props = f.properties;
                const isTornado = props.event.includes("Tornado");
                const text = (props.description + props.instruction).toUpperCase();
                const hasRotation = text.includes("ROTATION");
                const isInbound = text.includes("MOVING NORTHEAST") || text.includes("MOVING EAST");

                let urgencyClass = '';
                if (f.distance < 5) urgencyClass = 'urgent-red';
                else if (f.distance < 15) urgencyClass = 'urgent-yellow';

                const card = document.createElement('div');
                card.className = `alert-card ${urgencyClass}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="distance-tag">${f.distance ? f.distance.toFixed(1) + ' MILES AWAY' : 'POSITION UNKNOWN'}</span>
                        ${isInbound ? '<span class="bg-blue-800 text-white p-2 font-black">INBOUND THREAT</span>' : ''}
                    </div>
                    <h4 class="text-5xl font-black mb-2">${props.event}</h4>
                    <p class="text-2xl font-black text-red-700 mb-4">${hasRotation ? '!!! ROTATION DETECTED !!!' : ''}</p>
                    <p class="text-xl font-bold bg-white p-4 border-2 border-black">${props.areaDesc}</p>
                    <div class="mt-4 text-lg font-black uppercase">Expires: ${new Date(props.expires).toLocaleTimeString()}</div>
                `;
                container.appendChild(card);
            });
        }

        async function addAsset() {
            const val = document.getElementById('addrIn').value.trim();
            if (!val) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}`);
            const data = await res.json();
            if (data.length) {
                assets.push({ id: Date.now(), name: val.toUpperCase(), lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) });
                document.getElementById('addrIn').value = '';
                renderAssets();
                fetchAlerts();
            }
        }

        function renderAssets() {
            const list = document.getElementById('assetList');
            list.innerHTML = assets.map(a => `
                <div class="p-6 border-8 border-black mb-4">
                    <p class="text-3xl font-black uppercase">${a.name}</p>
                    <button onclick="assets=assets.filter(x=>x.id!==${a.id});renderAssets()" class="mt-4 w-full bg-black text-white p-3 font-black">TERMINATE PIN</button>
                </div>
            `).join('');
        }

        setInterval(fetchAlerts, 60000);
        fetchAlerts();
    </script>
</body>
</html>
