<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAISY: Direct Access Information System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --brand-pink: #ff69b4;
            --brand-aqua: #00ffff;
            --brand-purple: #4b0082;
            --brand-dark-blue: #00008b;
        }

        body {
            background-color: #ffffff;
            color: var(--brand-dark-blue);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
        }

        .body-glow {
            text-shadow: 0 0 5px rgba(0, 0, 139, 0.2);
        }

        h1 {
            color: #ffffff;
            text-shadow: 0 0 10px var(--brand-pink), 0 0 20px var(--brand-aqua);
            font-weight: 900;
            text-transform: uppercase;
        }

        .brand-border {
            border: 3px solid;
            border-image: linear-gradient(to right, var(--brand-pink), var(--brand-aqua)) 1;
            box-shadow: 0 0 12px var(--brand-aqua);
            background: #fff;
        }

        .emergency-alert {
            border: 4px solid #dc2626;
            background-color: #fef2f2;
            animation: border-pulse 2s infinite;
        }

        @keyframes border-pulse {
            0% { border-color: #dc2626; }
            50% { border-color: #f87171; }
            100% { border-color: #dc2626; }
        }

        .radar-frame {
            border: 2px solid var(--brand-dark-blue);
            height: 500px;
            width: 100%;
        }

        .status-badge {
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 9999px;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .btn-terminate {
            background-color: #dc2626;
            color: white;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.7rem;
        }
    </style>
</head>
<body class="body-glow">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 flex flex-col md:flex-row justify-between items-center bg-slate-900 p-6 rounded-lg shadow-xl">
            <div class="text-center md:text-left">
                <h1 class="text-3xl md:text-5xl">D.A.I.S.Y.</h1>
                <p class="text-cyan-400 font-bold text-sm tracking-widest mt-1">DIRECT NWS EMERGENCY INTERFACE</p>
            </div>
            <div class="text-white text-center md:text-right mt-4 md:mt-0">
                <div class="text-xs uppercase opacity-70">Live Telemetry</div>
                <div id="lastSync" class="text-xl font-mono font-bold text-green-400">CONNECTING...</div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 space-y-6">
                <div class="brand-border rounded-lg overflow-hidden shadow-2xl">
                    <iframe class="radar-frame" 
                        src="https://embed.windy.com/embed2.html?lat=35.385&lon=-94.398&zoom=8&level=surface&overlay=radar&product=radar&message=true" 
                        frameborder="0">
                    </iframe>
                </div>

                <div class="brand-border p-6">
                    <h2 class="text-2xl font-black mb-4 flex items-center gap-2">
                        <span class="w-4 h-4 bg-red-600 rounded-full animate-ping"></span>
                        ACTIVE SECTOR WARNINGS
                    </h2>
                    <div id="alertsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <p class="text-slate-500 italic">Syncing with National Weather Service servers...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="brand-border p-5 sticky top-5">
                    <h3 class="text-lg font-black mb-4 border-b-2 border-slate-100 pb-2">TRACKED ASSETS</h3>
                    
                    <div class="space-y-4">
                        <div class="flex flex-col gap-2">
                            <input id="addrIn" type="text" placeholder="Enter City or ZIP" 
                                class="w-full p-3 border-2 border-slate-200 rounded text-lg font-bold outline-none focus:border-blue-600">
                            <button onclick="addAsset()" class="w-full bg-blue-800 text-white font-black py-3 rounded shadow-lg hover:bg-blue-700">PIN LOCATION</button>
                        </div>

                        <div id="assetList" class="space-y-3 pt-4">
                            <p class="text-sm text-slate-400 text-center italic">No locations pinned.</p>
                        </div>
                    </div>
                    
                    <div class="mt-8 p-3 bg-slate-50 rounded border border-slate-200 text-[10px] leading-tight text-slate-500 uppercase font-bold">
                        Privacy Mode: Data is volatile. Refreshing purges all pinned assets.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let assets = [];
        const NWS_URL = "https://api.weather.gov/alerts/active?event=Tornado%20Warning,Tornado%20Watch,Severe%20Thunderstorm%20Warning";
        
        async function fetchAlerts() {
            try {
                const response = await fetch(NWS_URL, { headers: { 'User-Agent': 'DAISY_Emergency_System_v4' } });
                const data = await response.json();
                processAlerts(data.features);
                document.getElementById('lastSync').textContent = new Date().toLocaleTimeString();
            } catch (err) {
                document.getElementById('lastSync').textContent = "OFFLINE";
            }
        }

        function processAlerts(features) {
            const container = document.getElementById('alertsContainer');
            container.innerHTML = '';

            if (!features || features.length === 0) {
                container.innerHTML = '<div class="p-4 bg-green-50 text-green-800 font-bold rounded border border-green-200">NO ACTIVE WARNINGS IN SECTOR</div>';
                updateAssetStatus([]);
                return;
            }

            features.forEach(f => {
                const props = f.properties;
                const isTornado = props.event.includes("Tornado");
                const hasRotation = (props.description + props.instruction).toUpperCase().includes("ROTATION");
                
                const card = document.createElement('div');
                card.className = `p-4 rounded-lg shadow-md border-l-8 ${isTornado ? 'emergency-alert border-red-600' : 'bg-white border-orange-500'}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="bg-slate-800 text-white text-[10px] px-2 py-1 rounded font-bold uppercase">${props.areaDesc.split(';')[0]}</span>
                        ${hasRotation ? '<span class="bg-red-600 text-white text-[10px] px-2 py-1 rounded font-black animate-pulse">ROTATION DETECTED</span>' : ''}
                    </div>
                    <h4 class="text-xl font-black ${isTornado ? 'text-red-700' : 'text-orange-700'}">${props.event}</h4>
                    <p class="text-xs text-slate-700 mt-2 font-medium leading-relaxed line-clamp-3">${props.instruction || 'Seek local shelter.'}</p>
                    <div class="mt-3 pt-2 border-t border-slate-100 flex justify-between text-[10px] font-bold text-slate-400">
                        <span>EXPIRES:</span>
                        <span>${new Date(props.expires).toLocaleTimeString()}</span>
                    </div>
                `;
                container.appendChild(card);
            });
            updateAssetStatus(features);
        }

        async function addAsset() {
            const input = document.getElementById('addrIn');
            const val = input.value.trim();
            if (!val) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}`);
                const data = await res.json();
                if (data.length) {
                    assets.push({ id: Date.now(), name: val.toUpperCase(), lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) });
                    renderAssets();
                    input.value = '';
                    fetchAlerts();
                }
            } catch (e) { alert("Search failed."); }
        }

        function removeAsset(id) {
            assets = assets.filter(a => a.id !== id);
            renderAssets();
        }

        function renderAssets() {
            const list = document.getElementById('assetList');
            if (assets.length === 0) {
                list.innerHTML = '<p class="text-sm text-slate-400 text-center italic">No locations pinned.</p>';
                return;
            }
            list.innerHTML = assets.map((a) => `
                <div class="p-4 bg-white border-2 border-slate-100 rounded-lg shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <p class="font-black text-blue-900">${a.name}</p>
                        <button onclick="removeAsset(${a.id})" class="btn-terminate">Terminate</button>
                    </div>
                    <div id="stat-${a.id}" class="text-xs font-bold py-1 px-3 bg-slate-100 rounded text-center text-slate-500 uppercase">Scanning...</div>
                </div>
            `).join('');
        }

        function updateAssetStatus(alerts) {
            assets.forEach((asset) => {
                const el = document.getElementById(`stat-${asset.id}`);
                if (!el) return;
                let warned = false;
                alerts.forEach(alert => {
                    if (alert.properties.areaDesc.toUpperCase().includes(asset.name) || asset.name.includes(alert.properties.areaDesc.toUpperCase())) warned = true;
                });
                if (warned) {
                    el.textContent = "DANGER: WARNING ACTIVE";
                    el.className = "text-xs font-black py-1 px-3 bg-red-600 text-white rounded text-center animate-pulse uppercase";
                } else {
                    el.textContent = "SECTOR CLEAR";
                    el.className = "text-xs font-bold py-1 px-3 bg-green-500 text-white rounded text-center uppercase";
                }
            });
        }

        setInterval(fetchAlerts, 60000);
        fetchAlerts();
    </script>
</body>
</html>
