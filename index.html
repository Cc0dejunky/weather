<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAISY: Emergency System v6.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --danger-red: #dc2626;
            --caution-yellow: #d97706;
            --safe-green: #16a34a;
        }

        body {
            background-color: #f3f4f6 !important; /* Soft gray background to make white cards pop */
            color: #000000 !important;
            font-family: ui-sans-serif, system-ui, sans-serif;
            margin: 0;
            padding: 15px;
        }

        h1, h2, h3 { font-weight: 900; text-transform: uppercase; }
        
        .header-block {
            background: #000;
            color: #fff;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-bottom: 6px solid #1e3a8a;
            border-radius: 8px;
        }

        /* Card System */
        .alert-card {
            background: #ffffff;
            border: 3px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }

        .card-emergency { 
            border-color: var(--danger-red); 
            background: #fef2f2; 
            border-width: 4px;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.3);
        }
        
        .card-caution { 
            border-color: var(--caution-yellow); 
            background: #fffbeb; 
            border-width: 4px;
        }
        
        .keyword-tag {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 4px 10px;
            font-weight: 900;
            font-size: 0.85rem;
            border-radius: 4px;
            margin-right: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input {
            font-size: 1.1rem !important;
            font-weight: 700 !important;
            border: 3px solid #d1d5db !important;
            padding: 12px !important;
            width: 100%;
            border-radius: 8px;
        }

        input:focus {
            border-color: #1e3a8a !important;
            outline: none;
        }

        .btn-pin {
            background: #1e3a8a;
            color: white;
            font-size: 1.1rem;
            font-weight: 900;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .dev-note {
            background-color: #fef08a;
            color: #854d0e;
            padding: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            border: 2px solid #eab308;
            border-radius: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="max-w-6xl mx-auto">
        
        <div class="dev-note">
            NOTE: Sorry the app keeps changing, best time to work on it is during active tornadoes lol
        </div>

        <header class="header-block">
            <h1 class="text-3xl md:text-4xl tracking-tight">D.A.I.S.Y. // REGIONAL PATCH</h1>
            <div class="flex justify-between items-center mt-3 border-t border-gray-700 pt-3">
                <span class="font-bold text-sm uppercase text-yellow-400" id="audioStatus">AUDIO ALARM: CLICK PIN TO ARM</span>
                <span id="lastSync" class="font-bold text-lg text-green-400">SYNCING...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-2 border-2 border-gray-300 rounded-xl shadow-sm h-[400px]">
                    <iframe width="100%" height="100%" class="rounded-lg" src="https://embed.windy.com/embed2.html?lat=35.385&lon=-94.398&zoom=8&level=surface&overlay=radar&product=radar&message=true" frameborder="0"></iframe>
                </div>
                
                <div class="bg-white p-5 border-2 border-gray-300 rounded-xl shadow-sm">
                    <h2 class="text-2xl text-black border-b-4 border-black pb-2 mb-5">PROXIMITY ALERTS</h2>
                    <div id="alertsContainer" class="flex flex-col gap-4">
                        <p class="text-lg font-bold text-gray-500">Bypassing cache. Pulling raw NWS feed...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white p-5 border-2 border-gray-300 rounded-xl shadow-sm sticky top-5">
                    <h3 class="text-xl border-b-4 border-black pb-2 mb-5">MY ASSETS</h3>
                    <div class="mb-6">
                        <input id="addrIn" type="text" placeholder="ZIP or City (e.g. Fort Smith)">
                        <button onclick="addAsset()" class="btn-pin">PIN & ARM ALARM</button>
                    </div>
                    <div id="assetList" class="flex flex-col gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let assets = [];
        // Scoped to AR and OK for speed, combined with nocache
        const BASE_NWS_URL = "https://api.weather.gov/alerts/active?area=AR,OK";
        
        let audioCtx;
        let alarmTriggered = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                document.getElementById('audioStatus').textContent = "AUDIO ALARM: ARMED";
                document.getElementById('audioStatus').classList.replace("text-yellow-400", "text-green-400");
            }
        }

        function playAlarm() {
            if (!audioCtx || alarmTriggered) return;
            alarmTriggered = true;
            
            let beepCount = 0;
            const interval = setInterval(() => {
                if (beepCount >= 5) {
                    clearInterval(interval);
                    alarmTriggered = false;
                    return;
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                beepCount++;
            }, 500);
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8;
            const dLat = (lat2-lat1) * Math.PI / 180;
            const dLon = (lon2-lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function fetchAlerts() {
            try {
                const nocacheUrl = `${BASE_NWS_URL}&nocache=${Date.now()}`;
                const response = await fetch(nocacheUrl, { headers: { 'User-Agent': 'DAISY_Emergency_v6.3' } });
                const data = await response.json();
                processAlerts(data.features);
                document.getElementById('lastSync').textContent = new Date().toLocaleTimeString();
            } catch (err) { 
                console.error(err);
                document.getElementById('lastSync').textContent = "OFFLINE"; 
            }
        }

        function processAlerts(allFeatures) {
            const container = document.getElementById('alertsContainer');
            container.innerHTML = '';
            let shouldSoundAlarm = false;

            if (!allFeatures || allFeatures.length === 0) {
                container.innerHTML = '<p class="text-xl font-bold text-green-700 p-4 bg-green-50 rounded-lg border border-green-200">NO ACTIVE THREATS DETECTED.</p>';
                return;
            }

            const targetEvents = ["Tornado Warning", "Tornado Watch", "Severe Thunderstorm Warning", "Severe Weather Statement"];
            const features = allFeatures.filter(f => targetEvents.includes(f.properties.event));

            if (features.length === 0) {
                container.innerHTML = '<p class="text-xl font-bold text-green-700 p-4 bg-green-50 rounded-lg border border-green-200">NO SEVERE THREATS DETECTED.</p>';
                return;
            }

            features.forEach(f => {
                const props = f.properties;
                const text = (props.description + " " + (props.instruction || "")).toUpperCase();
                
                f.keywords = {
                    rotation: text.includes("ROTATION"),
                    observed: text.includes("OBSERVED") || text.includes("CONFIRMED"),
                    vector: text.match(/MOVING (\w+) AT (\d+) MPH/)
                };

                if (assets.length > 0) {
                    const coords = f.geometry ? f.geometry.coordinates[0][0] : [-94.39, 35.38];
                    f.minDist = Math.min(...assets.map(a => getDistance(a.lat, a.lon, coords[1], coords[0])));
                } else {
                    f.minDist = 999;
                }
            });

            features.sort((a, b) => a.minDist - b.minDist);
            const closestFeatures = features.slice(0, 10);

            closestFeatures.forEach(f => {
                const props = f.properties;
                const isClose = f.minDist < 20;
                const isDangerous = f.keywords.rotation || f.keywords.observed || props.event.includes("Tornado");
                
                if (isClose && isDangerous && audioCtx) {
                    shouldSoundAlarm = true;
                }

                const card = document.createElement('div');
                card.className = `alert-card ${f.minDist < 15 ? 'card-emergency' : (f.minDist < 30 ? 'card-caution' : '')}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="bg-black text-white px-3 py-1 font-bold text-sm rounded-full">${f.minDist < 999 ? f.minDist.toFixed(1) + ' MILES AWAY' : 'REGIONAL'}</span>
                        <span class="text-xs font-bold text-gray-500 uppercase">Expires: ${new Date(props.expires).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                    
                    <h4 class="text-2xl font-black mb-2 text-black leading-tight">${props.event}</h4>
                    
                    <div class="mb-3">
                        ${f.keywords.observed ? '<span class="keyword-tag bg-red-600">CONFIRMED TORNADO</span>' : ''}
                        ${f.keywords.rotation ? '<span class="keyword-tag bg-red-500">ROTATION DETECTED</span>' : ''}
                        ${f.keywords.vector ? `<span class="keyword-tag bg-blue-800">MOVING ${f.keywords.vector[1]} @ ${f.keywords.vector[2]} MPH</span>` : ''}
                    </div>
                    
                    <p class="text-sm font-bold bg-gray-100 p-3 rounded text-gray-800">${props.areaDesc}</p>
                `;
                container.appendChild(card);
            });

            if (shouldSoundAlarm) playAlarm();
        }

        async function addAsset() {
            initAudio();
            const input = document.getElementById('addrIn');
            const val = input.value.trim();
            if (!val) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}`);
            const data = await res.json();
            if (data.length) {
                assets.push({ id: Date.now(), name: val.toUpperCase(), lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) });
                input.value = '';
                renderAssets();
                fetchAlerts(); 
            }
        }

        function renderAssets() {
            const list = document.getElementById('assetList');
            list.innerHTML = assets.map(a => `
                <div class="p-3 border-2 border-gray-200 bg-gray-50 rounded-lg flex justify-between items-center">
                    <p class="text-sm font-black text-blue-900">${a.name}</p>
                    <button onclick="assets=assets.filter(x=>x.id!==${a.id});renderAssets();fetchAlerts()" class="text-xs font-bold text-red-600 border border-red-200 bg-white px-2 py-1 rounded hover:bg-red-50">REMOVE</button>
                </div>
            `).join('');
        }

        setInterval(fetchAlerts, 30000);
        fetchAlerts();
    </script>
</body>
</html>
