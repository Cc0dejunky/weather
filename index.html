<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAISY: Direct Access Information System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-aqua: #00ffff;
            --neon-purple: #9d00ff;
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            background-image: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
            min-height: 100vh;
        }

        /* Cyberpunk Headers */
        h1, h2 {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-aqua);
        }

        .neon-border {
            border: 2px solid var(--neon-aqua);
            box-shadow: 0 0 15px var(--neon-aqua), inset 0 0 5px var(--neon-aqua);
            background: rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }

        .alert-active {
            border-color: var(--neon-pink) !important;
            box-shadow: 0 0 20px var(--neon-pink) !important;
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .scanning-bar {
            height: 2px;
            background: var(--neon-aqua);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .scanning-bar::after {
            content: "";
            display: block;
            width: 50px;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 15px #fff;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            from { left: -10%; }
            to { left: 110%; }
        }

        input {
            background: #000 !important;
            border: 1px solid var(--neon-purple) !important;
            color: var(--neon-aqua) !important;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black mb-1">D.A.I.S.Y. v4.0</h1>
                <p class="text-xs text-aqua-400 opacity-70">DIRECT ACCESS INFORMATION SYSTEM // NO_PERSISTENCE_MODE</p>
            </div>
            <div class="text-right font-mono">
                <div class="text-[10px] text-gray-500 uppercase">System Telemetry</div>
                <div id="lastSync" class="text-sm text-cyan-400">SYNCING...</div>
                <div class="scanning-bar mt-1"></div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-2 neon-border rounded-lg overflow-hidden h-[400px] relative">
                <iframe 
                    width="100%" height="100%" 
                    src="https://embed.windy.com/embed2.html?lat=35.385&lon=-94.398&zoom=8&level=surface&overlay=radar&product=radar&message=true" 
                    frameborder="0">
                </iframe>
            </div>

            <div class="neon-border p-6 rounded-lg flex flex-col">
                <h3 class="text-purple-400 font-bold mb-4 text-xs uppercase tracking-widest">Asset Monitoring</h3>
                <div class="flex gap-2 mb-6">
                    <input id="addrIn" type="text" placeholder="ZIP / ADDR" class="flex-1 p-2 text-sm rounded outline-none">
                    <button onclick="addAsset()" class="bg-purple-900 text-white px-4 text-xs font-bold hover:bg-purple-700 transition">PIN</button>
                </div>
                <div id="assetList" class="space-y-3 flex-1 overflow-y-auto max-h-[250px]">
                    <p class="text-[10px] text-gray-600 italic">No assets pinned in volatile memory.</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <div class="neon-border p-6 rounded-lg">
                <h2 class="text-xl mb-6 flex items-center gap-3">
                    <span class="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></span>
                    Regional Sector Scan
                </h2>
                <div id="alertsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <p class="text-gray-500 text-sm">Initializing direct NWS handshake...</p>
                </div>
            </div>
        </div>

        <footer class="mt-12 border-t border-gray-800 pt-4 text-[10px] text-gray-600 flex justify-between">
            <span>VOLATILE_MEMORY_ACTIVE // ZERO_COOKIES</span>
            <span>DATA_SOURCE: NWS_API_V1</span>
        </footer>
    </div>

    <script>
        let assets = [];
        const NWS_URL = "https://api.weather.gov/alerts/active?event=Tornado%20Warning,Tornado%20Watch,Severe%20Thunderstorm%20Warning";
        
        async function fetchAlerts() {
            try {
                const response = await fetch(NWS_URL, {
                    headers: { 'User-Agent': 'DAISY_Emergency_System_v4' }
                });
                const data = await response.json();
                processAlerts(data.features);
                document.getElementById('lastSync').textContent = `LAST_SYNC: ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                console.error("NWS Handshake Failed", err);
                document.getElementById('lastSync').textContent = "CONNECTION_ERROR";
            }
        }

        function processAlerts(features) {
            const container = document.getElementById('alertsContainer');
            container.innerHTML = '';

            if (features.length === 0) {
                container.innerHTML = '<p class="text-cyan-900 font-bold">ALL SECTORS CLEAR</p>';
                updateAssetStatus(null);
                return;
            }

            features.forEach(f => {
                const props = f.properties;
                const isTornado = props.event.includes("Tornado");
                const hasRotation = props.description.includes("RADAR INDICATED ROTATION") || 
                                   props.description.includes("OBSERVED TORNADO");
                
                const card = document.createElement('div');
                card.className = `p-4 border border-gray-800 bg-black transition ${isTornado ? 'alert-active' : ''}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] px-2 py-0.5 bg-gray-900 border border-gray-700">${props.areaDesc.split(';')[0]}</span>
                        ${hasRotation ? '<span class="text-[10px] text-red-500 font-black animate-bounce">ROTATION</span>' : ''}
                    </div>
                    <h4 class="text-sm font-bold text-white mb-1">${props.event}</h4>
                    <p class="text-[10px] text-gray-400 line-clamp-2">${props.instruction || 'Follow local news.'}</p>
                    <div class="mt-3 text-[9px] text-gray-600 font-mono uppercase">Expires: ${new Date(props.expires).toLocaleTimeString()}</div>
                `;
                container.appendChild(card);
            });

            updateAssetStatus(features);
        }

        async function addAsset() {
            const val = document.getElementById('addrIn').value;
            if (!val) return;
            
            // Minimal Geocode (Nominatim)
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${val}`);
                const data = await res.json();
                if (data.length) {
                    assets.push({
                        name: val.toUpperCase(),
                        lat: parseFloat(data[0].lat),
                        lon: parseFloat(data[0].lon),
                        status: 'SCANNING'
                    });
                    renderAssets();
                    document.getElementById('addrIn').value = '';
                }
            } catch (e) { alert("Geocode Failed"); }
        }

        function renderAssets() {
            const list = document.getElementById('assetList');
            list.innerHTML = assets.map((a, i) => `
                <div class="p-3 bg-black border border-gray-800 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-bold text-cyan-400">${a.name}</p>
                        <p id="stat-${i}" class="text-[9px] text-gray-500">MONITORING...</p>
                    </div>
                    <button onclick="assets.splice(${i},1);renderAssets()" class="text-red-900 hover:text-red-500 text-xs">×</button>
                </div>
            `).join('');
        }

        function updateAssetStatus(alerts) {
            if (!alerts) return;
            assets.forEach((asset, idx) => {
                const el = document.getElementById(`stat-${idx}`);
                let warned = false;
                
                // Point-in-polygon logic would go here; simplified for speed to area check
                alerts.forEach(alert => {
                    if (alert.properties.areaDesc.toUpperCase().includes(asset.name)) warned = true;
                });

                if (warned) {
                    el.textContent = "!!! WARNING ACTIVE !!!";
                    el.className = "text-[9px] text-red-500 font-bold animate-pulse";
                } else {
                    el.textContent = "SAFE // NO ACTIVE POLYGON";
                    el.className = "text-[9px] text-green-500";
                }
            });
        }

        // 60s Polling Cycle
        setInterval(fetchAlerts, 60000);
        fetchAlerts();
    </script>
</body>
</html>
